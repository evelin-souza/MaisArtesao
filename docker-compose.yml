services:
  postgres:
    image: postgres:16-alpine
    container_name: maisartesao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maisartesao
      POSTGRES_USER: maisartesao_user
      POSTGRES_PASSWORD: maisartesao123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maisartesao_user -d maisartesao"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maisartesao-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: