services:
  postgres:
    image: postgres:16-alpine
    container_name: maisartesao-postgres
    restart: unless-stopped
    environment:
      # Mesmas variáveis do .env usadas pelo backend (fonte única das credenciais)
      POSTGRES_DB: ${DB_DATABASE:-maisartesao}
      POSTGRES_USER: ${DB_USERNAME:-maisartesao_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maisartesao123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maisartesao-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: